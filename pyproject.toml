[project]
name = "chesscoach"
version = "0.1.0"
description = "Coach de xadrez em janela flutuante para treino."
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.26",
    "chess>=1.10",
    "mss>=9.0",
    "opencv-python>=4.9",
    "google-genai>=1.0",
    "truststore>=0.10",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
chesscoach = "chesscoach.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chesscoach = ["vision/pieces/lichess/*", "vision/pieces/model/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
